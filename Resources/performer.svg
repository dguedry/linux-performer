<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2f3a"/>
      <stop offset="1" stop-color="#15161c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5aa9ff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e2d6"/>
    </linearGradient>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="104" ry="104"/></clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- stage light -->
    <circle cx="256" cy="86" r="26" fill="#5aa9ff"/>
    <polygon points="232,100 280,100 470,318 42,318" fill="url(#beam)"/>
    <!-- keyboard: 7 white keys -->
    <rect x="0" y="318" width="512" height="194" fill="url(#ivory)"/>
    <g fill="none" stroke="#9e9a8f" stroke-width="5">
      <line x1="73" y1="318" x2="73" y2="512"/>
      <line x1="146" y1="318" x2="146" y2="512"/>
      <line x1="219" y1="318" x2="219" y2="512"/>
      <line x1="292" y1="318" x2="292" y2="512"/>
      <line x1="365" y1="318" x2="365" y2="512"/>
      <line x1="438" y1="318" x2="438" y2="512"/>
    </g>
    <!-- black keys: C# D#  F# G# A# -->
    <g fill="#1b1c22">
      <rect x="50" y="318" width="46" height="120" rx="6"/>
      <rect x="123" y="318" width="46" height="120" rx="6"/>
      <rect x="269" y="318" width="46" height="120" rx="6"/>
      <rect x="342" y="318" width="46" height="120" rx="6"/>
      <rect x="415" y="318" width="46" height="120" rx="6"/>
    </g>
    <!-- the key under the light is being played -->
    <rect x="222" y="318" width="67" height="194" fill="#5aa9ff" opacity="0.85"/>
    <rect x="0" y="318" width="512" height="6" fill="#0f1014" opacity="0.6"/>
  </g>
</svg>
